<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Good Evening, Joey</title>
<meta name="description" content="A good evening card for Joey, read with the eyes.">
<meta property="og:title" content="Good evening, Joey">
<meta property="og:description" content="Look around. The stars come out where you look.">
<style>
/* ============================================================================
   GOOD EVENING, JOEY · a night sky that answers his eyes.
   Style: night-sky spotlight, the same proven model as hello.html (2026-08-13).
   Joey drives a TD Pilot: his gaze moves the pointer, AssistiveTouch sends taps.
   So the pointer IS his gaze, and looking is the whole interface:
   - Stars bloom where he looks and STAY. Looking is rewarded, never undone.
   - Lines of the message wake as the light passes. Zero clicks, zero dwell.
   - Nothing activates on hover. There is no target at all until the end.
   - Nobody gets stuck: any tap or key, or 6 still seconds, lights everything.
   - prefers-reduced-motion gets the whole sky at once.
   ========================================================================= */
:root{color-scheme:dark;--ink:#FFF6E6;--amber:#FFC061;--dim:#A9B1C4;--x:50vw;--y:50vh}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#04050B;color:var(--ink);overflow:hidden;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(#04050B 0%,#0B1030 45%,#2A1636 72%,#3A1A22 100%)}
.stage img{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;object-fit:cover;object-position:50% 70%;opacity:.7;
  -webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.beam{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(circle 280px at var(--x) var(--y),rgba(255,192,97,.20) 0%,rgba(255,192,97,.07) 40%,rgba(4,5,11,0) 72%)}
.words{position:fixed;inset:0 0 clamp(170px,22vh,220px) 0;z-index:3;pointer-events:none}
.w{position:absolute;transform:translate(-50%,-50%);margin:0;opacity:1;
  font-size:clamp(26px,3.6vw,54px);line-height:1.15;font-weight:700;max-width:15ch;text-align:center;
  transition:opacity .5s ease,filter .5s ease,text-shadow .5s ease}
.js .w{opacity:.06;filter:blur(1px)}
.js .w.lit{opacity:1;filter:none;text-shadow:0 0 30px rgba(255,192,97,.55)}
.w.small{font-size:clamp(19px,2.1vw,28px);font-weight:500;color:var(--dim);max-width:22ch}
.js .w.small.lit{color:var(--ink)}
.count{position:fixed;top:clamp(14px,3vh,28px);right:clamp(16px,3vw,34px);z-index:4;
  font-size:clamp(17px,1.8vw,22px);color:var(--amber);font-variant-numeric:tabular-nums;opacity:.9}
.hint{display:none;position:fixed;left:50%;bottom:clamp(18px,4vh,40px);transform:translateX(-50%);z-index:5;margin:0;
  color:var(--dim);font-size:clamp(17px,1.8vw,22px);text-align:center;max-width:86vw;transition:opacity .6s}
.js .hint{display:block}
.hint.gone{opacity:0}
.end{position:fixed;left:50%;bottom:clamp(22px,5vh,54px);transform:translateX(-50%);z-index:6;display:flex;margin:0;
  min-height:128px;min-width:min(86vw,560px);padding:22px 34px;border-radius:18px;
  background:rgba(14,18,34,.9);box-shadow:inset 0 0 0 3px var(--amber);
  color:var(--amber);font-size:clamp(21px,2.4vw,28px);font-weight:600;line-height:1.3;text-align:center;
  align-items:center;justify-content:center;display:flex}
.js .end{display:none}
.end.on,.js .end.on{display:flex;animation:up .7s ease both}
@keyframes up{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:700px){.w{left:50% !important;max-width:82vw}}
@media (prefers-reduced-motion:reduce){.w{opacity:1;filter:none;transition:none}.beam{display:none}.end{display:flex}.hint{display:none}}
</style>
</head>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="beam" aria-hidden="true"></div>

<main class="words" id="words">
  <p class="w"       style="left:26%;top:14%">Good evening, Joey.</p>
  <p class="w small" style="left:73%;top:30%">This is Darby, Gordon's AI assistant.</p>
  <p class="w"       style="left:27%;top:47%">Your eyes make the stars.</p>
  <p class="w small" style="left:72%;top:63%">Every place you look stays lit. Fill the sky.</p>
  <p class="w small" style="left:28%;top:82%">Gordon asked me to make this for you.</p>
</main>

<p class="count" id="count" aria-live="polite"></p>
<p class="hint" id="hint">Just look around.</p>
<p class="end" id="end">Your sky, lit by your eyes. Good night, Joey. No reply needed.</p>

<script>
document.documentElement.className="js";
(function(){
"use strict";
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
var cv = document.getElementById("sky"), cx = cv.getContext("2d");
var words = [].slice.call(document.querySelectorAll(".w"));
var hint = document.getElementById("hint"), end = document.getElementById("end"), count = document.getElementById("count");
var root = document.documentElement, dpr = Math.min(2, devicePixelRatio || 1);
var W, H, R, stars = [], lit = 0, done = false, moved = false, px, py;

function size(){
  W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  R = Math.max(240, Math.hypot(W,H) * 0.16);
}
size(); px = W/2; py = H/2;
/* a fixed field of hidden stars in the sky, a little denser up high */
var N = 90, seed = 7;
function rnd(){ seed = (seed*16807) % 2147483647; return seed/2147483647; }
for (var i=0;i<N;i++) stars.push({x:rnd(), y:Math.pow(rnd(),1.3)*0.72, r:1.2+rnd()*2.4, on:0, t:rnd()*6.28});

function draw(now){
  cx.clearRect(0,0,W,H);
  var litStars = [];
  for (var i=0;i<N;i++){
    var s = stars[i]; if (!s.on) continue;
    s.on = Math.min(1, s.on + 0.04);
    var x = s.x*W, y = s.y*H, tw = .75 + .25*Math.sin(now/700 + s.t);
    var g = cx.createRadialGradient(x,y,0,x,y,s.r*6);
    g.addColorStop(0,"rgba(255,236,200,"+(s.on*tw)+")"); g.addColorStop(1,"rgba(255,236,200,0)");
    cx.fillStyle = g; cx.beginPath(); cx.arc(x,y,s.r*6,0,6.3); cx.fill();
    cx.fillStyle = "rgba(255,255,255,"+(s.on*tw)+")"; cx.beginPath(); cx.arc(x,y,s.r*.7,0,6.3); cx.fill();
    litStars.push(s);
  }
  /* faint constellation lines between near lit stars: the reward grows as he looks */
  cx.strokeStyle = "rgba(255,192,97,.22)"; cx.lineWidth = 1;
  for (var a=0;a<litStars.length;a++) for (var b=a+1;b<litStars.length;b++){
    var p=litStars[a], q=litStars[b], d=Math.hypot((p.x-q.x)*W,(p.y-q.y)*H);
    if (d < Math.min(W,H)*0.14){ cx.beginPath(); cx.moveTo(p.x*W,p.y*H); cx.lineTo(q.x*W,q.y*H); cx.stroke(); }
  }
  requestAnimationFrame(draw);
}

function lightNear(x,y){
  var n = 0;
  for (var i=0;i<N;i++){ var s=stars[i];
    if (!s.on && Math.hypot(s.x*W-x, s.y*H-y) < R*0.75){ s.on = 0.01; n++; } }
  if (n){ lit += n; count.textContent = lit + " of " + N + " stars"; }
  var w = 0;
  words.forEach(function(el){ var r = el.getBoundingClientRect();
    if (Math.hypot(r.left+r.width/2-x, r.top+r.height/2-y) < R) el.classList.add("lit");
    if (el.classList.contains("lit")) w++; });
  if (w === words.length || lit >= N*0.6) finish();
}
function finish(){
  if (done) return; done = true;
  words.forEach(function(el){ el.classList.add("lit"); });
  hint.classList.add("gone"); end.classList.add("on");
}
function all(){ stars.forEach(function(s){ if(!s.on) s.on=0.01; }); lit = N; count.textContent = N + " of " + N + " stars"; finish(); }

var ticking = false;
addEventListener("pointermove", function(e){
  px = e.clientX; py = e.clientY; moved = true;
  root.style.setProperty("--x", px+"px"); root.style.setProperty("--y", py+"px");
  hint.classList.add("gone");
  if (!ticking){ ticking = true; requestAnimationFrame(function(){ ticking = false; lightNear(px,py); }); }
}, {passive:true});
addEventListener("pointerdown", function(e){ lightNear(e.clientX,e.clientY); finish(); }, {passive:true});
addEventListener("keydown", all);
addEventListener("resize", size, {passive:true});
setTimeout(function(){ if(!moved) all(); }, 6000);
setTimeout(finish, 20000);
if (reduce) all();
requestAnimationFrame(draw);
})();
</script>
</body>
