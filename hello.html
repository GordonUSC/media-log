/* ============================================================================
   THE SPOTLIGHT · a welcome that is READ WITH THE EYES.
   Joey navigates with a TD Pilot. His gaze moves the pointer, so the pointer IS
   his gaze. Here that is the whole interface: the light follows where he looks
   and the words wake up as it passes.
   Non-negotiables:
   - Reading this requires ZERO clicks and ZERO dwell. Nothing to activate.
   - Once a line is lit it STAYS lit. Re-hiding read text would be cruel when
     re-finding it costs real effort.
   - Nobody can get stuck: no pointer for 6s, or any tap or key, reveals all.
   - prefers-reduced-motion gets the whole message immediately, no hunting.
   ========================================================================= */
:root{
  color-scheme:dark;
  --ink:#FFF6E6; --amber:#FFC061; --dim:#9AA3B4;
  --x:50vw; --y:50vh;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#05060A;color:var(--ink);overflow:hidden;
  font-family:"Switzer",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.stage{position:fixed;inset:0;overflow:hidden}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
/* the beam: a soft pool of light that rides the pointer, which is his gaze */
.beam{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(circle 300px at var(--x) var(--y),
    rgba(255,192,97,.30) 0%, rgba(255,192,97,.13) 38%, rgba(5,6,10,0) 72%);
  transition:background .06s linear}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(circle 460px at var(--x) var(--y),
    rgba(5,6,10,0) 0%, rgba(5,6,10,.55) 55%, rgba(5,6,10,.93) 100%)}

.words{position:fixed;left:0;right:0;top:2vh;bottom:clamp(190px,24vh,240px);z-index:3;pointer-events:none}
.w{position:absolute;transform:translate(-50%,-50%);
  font-size:clamp(24px,3.4vw,50px);line-height:1.15;font-weight:600;letter-spacing:-.01em;
  max-width:15ch;text-align:center;
  opacity:.045;filter:blur(1px);
  transition:opacity .5s ease, filter .5s ease, text-shadow .5s ease}
.w.lit{opacity:1;filter:none;text-shadow:0 0 34px rgba(255,192,97,.5)}
.w.small{font-size:clamp(18px,2vw,26px);font-weight:500;color:var(--dim);max-width:22ch}
.w.small.lit{color:var(--ink)}

/* the one and only target, and it never appears until the message is read */
.finish{position:fixed;left:50%;bottom:clamp(22px,5vh,54px);transform:translateX(-50%);
  z-index:6;display:none;text-decoration:none}
.finish.on{display:block;animation:up .6s ease both}
@keyframes up{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
.finish span{display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:128px;min-width:min(86vw,540px);padding:20px 34px;border-radius:16px;
  background:rgba(21,27,39,.94);box-shadow:inset 0 0 0 3px var(--amber);
  color:var(--amber);font-size:clamp(20px,2.4vw,27px);font-weight:600;line-height:1.25}
.finish:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:18px}

.hint{position:fixed;left:50%;bottom:clamp(18px,4vh,40px);transform:translateX(-50%);z-index:5;
  color:var(--dim);font-size:clamp(15px,1.6vw,19px);text-align:center;max-width:80vw;
  transition:opacity .6s}
.hint.gone{opacity:0}

/* narrow screens: stack the lines down the middle so nothing can run off the
   edge. The vertical spacing already keeps them apart. */
@media(max-width:700px){
  .w{left:50% !important;max-width:80vw}
  .w.small{max-width:82vw}
}
@media (prefers-reduced-motion:reduce){
  .w{opacity:1;filter:none;transition:none}
  .beam,.vignette{display:none}
  .finish{display:block}
}

  for(var i=0;i<words.length;i++){
    var w = words[i], r = w.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    var d = Math.hypot(cx - px, cy - py);
    /* generous radius, scaled to the screen: gaze is approximate and a big
       display must not need a more accurate sweep than a small one */
    if(d < RADIUS) w.classList.add("lit");
    if(w.classList.contains("lit")) lit++;
  }
  /* the way out appears before the last word, so a single missed line can
     never strand anyone */
  if(lit >= words.length - 2){ hint.classList.add("gone"); finish.classList.add("on"); }
  if(lit === words.length) revealAll();
}
var ticking = false;
function onMove(x,y){
  px = x; py = y; moved = true;
  root.style.setProperty("--x", x + "px");
  root.style.setProperty("--y", y + "px");
  hint.classList.add("gone");
  if(!ticking){ ticking = true; requestAnimationFrame(function(){ ticking = false; check(); }); }
}
addEventListener("pointermove", function(e){ onMove(e.clientX, e.clientY); }, {passive:true});

/* Nobody gets stuck. Any tap, any key, or six quiet seconds gives the whole thing. */
addEventListener("pointerdown", function(e){ onMove(e.clientX, e.clientY); revealAll(); }, {passive:true});
addEventListener("keydown", revealAll);
setTimeout(function(){ if(!moved) revealAll(); }, 6000);
/* and a hard backstop so the target is always reachable */
setTimeout(revealAll, 20000);

if(reduce) revealAll();
else { root.style.setProperty("--x", px+"px"); root.style.setProperty("--y", py+"px"); }
})();
</script>
